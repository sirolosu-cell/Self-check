<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来院前セルフチェック — お試し版</title>
<style>
  :root{
    --ink:#23302e;
    --ink-soft:#5a6b67;
    --paper:#f4f0e8;
    --card:#fffdf8;
    --accent:#2f6f63;
    --accent-deep:#1f4f46;
    --accent-soft:#dcebe6;
    --line:#e3ddd0;
    --gold:#b08646;
    --shadow:0 18px 40px -22px rgba(31,79,70,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--paper);color:var(--ink);
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    -webkit-font-smoothing:antialiased;line-height:1.7}
  .wrap{max-width:520px;margin:0 auto;padding:0 18px 80px}

  /* top bar */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(244,240,232,.9);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;max-width:520px;margin:0 auto}
  .brand{font-size:14px;letter-spacing:.18em;color:var(--accent-deep)}
  .src{display:flex;gap:4px}
  .src button{font:inherit;font-size:11px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-soft);padding:4px 8px;border-radius:999px;
    cursor:pointer;letter-spacing:.05em}
  .src button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  .gear{position:fixed;right:16px;bottom:16px;z-index:40;width:54px;height:54px;
    border-radius:50%;background:var(--accent-deep);color:#fff;border:none;cursor:pointer;
    box-shadow:var(--shadow);font-size:22px;display:flex;align-items:center;justify-content:center}

  /* intro */
  .hero{padding:46px 0 24px;text-align:center}
  .kicker{font-size:11px;letter-spacing:.32em;color:var(--gold);margin-bottom:14px}
  h1.head{font-size:25px;line-height:1.5;font-weight:600;letter-spacing:.02em}
  .sub{margin-top:16px;color:var(--ink-soft);font-size:14px}
  .start{margin-top:30px;display:inline-block;background:var(--accent);color:#fff;
    border:none;font:inherit;font-size:15px;padding:14px 38px;border-radius:999px;
    cursor:pointer;letter-spacing:.08em;box-shadow:var(--shadow)}
  .ornament{width:38px;height:1px;background:var(--gold);margin:22px auto 0;opacity:.6}

  /* progress */
  .prog{height:3px;background:var(--line);border-radius:2px;margin:8px 0 26px;overflow:hidden}
  .prog > span{display:block;height:100%;background:var(--accent);transition:width .4s ease}

  /* question card */
  .qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:26px 22px;box-shadow:var(--shadow);animation:rise .45s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .qnum{font-size:11px;letter-spacing:.2em;color:var(--gold)}
  .qtext{font-size:18px;margin:8px 0 20px;line-height:1.55}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{font:inherit;font-size:15px;text-align:left;background:#fff;border:1.5px solid var(--line);
    border-radius:12px;padding:14px 16px;cursor:pointer;color:var(--ink);transition:.18s;
    display:flex;align-items:center;gap:10px}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
  .opt .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);
    flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
  .opt.sel .tick{background:var(--accent);border-color:var(--accent)}
  .navrow{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
  .nav{font:inherit;font-size:14px;padding:11px 22px;border-radius:999px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink-soft)}
  .nav.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .nav:disabled{opacity:.4;cursor:default}
  .multi-note{font-size:12px;color:var(--ink-soft);margin-top:14px;text-align:center}

  /* result */
  .res{animation:rise .5s ease both}
  .tname{font-size:26px;letter-spacing:.04em;margin-top:6px}
  .ttag{color:var(--accent);font-size:14px;margin-top:8px}
  .reslabel{font-size:11px;letter-spacing:.28em;color:var(--gold);text-align:center}
  .block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px;box-shadow:var(--shadow)}
  .block h3{font-size:13px;letter-spacing:.14em;color:var(--accent-deep);margin-bottom:10px;
    display:flex;align-items:center;gap:8px}
  .block h3::before{content:"";width:14px;height:2px;background:var(--gold)}
  .block p{font-size:14px;color:var(--ink)}
  .block p + p{margin-top:10px}
  .steps{display:flex;flex-direction:column;gap:0}
  .step{display:flex;gap:14px;padding:10px 0;position:relative}
  .step:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:-4px;width:2px;background:var(--accent-soft)}
  .stepnum{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.05em;z-index:1}
  .steptxt{padding-top:5px;font-size:14px}
  .range{text-align:center;padding:8px 0}
  .rangebig{font-size:30px;color:var(--accent-deep);letter-spacing:.04em}
  .rangecopy{font-size:13px;color:var(--ink-soft);margin-top:10px}
  .disc{font-size:11px;color:var(--ink-soft);background:#f7f4ec;border:1px dashed var(--line);
    border-radius:10px;padding:12px;margin-top:14px;line-height:1.6}

  /* menu + tickets */
  .menucard{padding:14px 0;border-bottom:1px dotted var(--line)}
  .menucard:last-child{border-bottom:none}
  .menucard .mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .menucard .mname{font-size:14px;font-weight:600}
  .menucard .pr{color:var(--accent-deep);font-weight:600;white-space:nowrap}
  .menucard .mdesc{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.65}
  .tk{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;
    border:1px solid var(--line);border-radius:12px;margin-top:10px;background:#fff}
  .tk.hot{border-color:var(--accent);background:var(--accent-soft)}
  .tk .left{font-size:14px}
  .tk .badge{font-size:10px;letter-spacing:.1em;color:#fff;background:var(--gold);padding:2px 7px;border-radius:6px;margin-left:8px}
  .tk .save{font-size:11px;color:var(--accent);margin-top:2px}
  .tk .price{text-align:right}
  .tk .price .now{font-size:17px;color:var(--accent-deep);font-weight:600}
  .tk .price .was{font-size:11px;color:var(--ink-soft);text-decoration:line-through}
  .cta{width:100%;margin-top:24px;background:var(--accent-deep);color:#fff;border:none;
    font:inherit;font-size:16px;padding:16px;border-radius:14px;cursor:pointer;letter-spacing:.1em;box-shadow:var(--shadow)}
  .restart{width:100%;margin-top:12px;background:none;border:1px solid var(--line);
    color:var(--ink-soft);font:inherit;padding:12px;border-radius:14px;cursor:pointer}

  /* settings drawer */
  .overlay{position:fixed;inset:0;background:rgba(31,48,46,.5);z-index:50;display:none}
  .overlay.open{display:block}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:min(420px,92vw);background:var(--paper);
    z-index:60;transform:translateX(100%);transition:.32s ease;overflow-y:auto;
    box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);padding:22px}
  .drawer.open{transform:none}
  .drawer h2{font-size:16px;letter-spacing:.1em;margin-bottom:4px}
  .drawer .hint{font-size:12px;color:var(--ink-soft);margin-bottom:18px}
  .field{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line)}
  .field label{font-size:13px;flex:1}
  .field input{width:96px;font:inherit;font-size:14px;text-align:right;padding:8px 10px;
    border:1px solid var(--line);border-radius:8px;background:#fff}
  .field .unit{font-size:12px;color:var(--ink-soft);width:20px}
  .secttl{font-size:11px;letter-spacing:.2em;color:var(--gold);margin:20px 0 4px}
  .drawer .close{position:absolute;top:18px;right:18px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink-soft)}
  .save-note{font-size:11px;color:var(--ink-soft);margin-top:18px;line-height:1.6;
    background:#fffdf8;border:1px solid var(--line);border-radius:10px;padding:12px}
  .preview-tag{position:fixed;left:10px;bottom:10px;z-index:40;font-size:10px;letter-spacing:.1em;
    background:var(--ink);color:#fff;padding:4px 10px;border-radius:6px;opacity:.7;font-family:sans-serif}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">SELF CHECK</div>
  <div class="src" id="srcSwitch">
    <button data-src="sns">SNS</button>
    <button data-src="hp" class="on">HP</button>
    <button data-src="referral">紹介</button>
  </div>
</div>

<div class="wrap" id="app"></div>

<button class="gear" id="gear" title="料金設定">⚙</button>
<div class="preview-tag">PREVIEW / お試し版</div>

<!-- settings drawer -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <button class="close" id="closeDrawer">×</button>
  <h2>料金・割引の設定</h2>
  <div class="hint">ここを変えると結果画面の価格に即反映されます。実装版では flow-data.json に保存されます。</div>
  <div class="secttl">施術メニュー単価（円）</div>
  <div id="menuFields"></div>
  <div class="secttl">回数券の割引率（%）</div>
  <div id="ticketFields"></div>
  <div class="save-note">
    💡 5%刻みに縛られず、何%でも自由に入力できます。「10回券だけ18%」のような個別設定もここで完結します。<br><br>
    実装版では、ここでの数値が flow-data.json に書き込まれ、コードを触らずに料金改定ができます。
  </div>
</div>

      {id:"e_regular",label:"定期的にしている",scores:{}},
      {id:"e_sometimes",label:"たまにする",scores:{rangeOfMotion:1}},
      {id:"e_none",label:"ほとんどしない",scores:{rangeOfMotion:1,fatigue:1}}
    ]},
    {id:"q_history",text:"これまでに何かケアをしましたか？",type:"single",options:[
      {id:"h_none",label:"特に何もしていない",scores:{acute:1}},
      {id:"h_otc",label:"市販薬・湿布でしのいでいる",scores:{recurrent:1}},
      {id:"h_other",label:"他院に通ったことがある",scores:{recurrent:1,chronic:1}},
      {id:"h_failed",label:"通ったが改善しなかった",scores:{chronic:2}}
    ]},
    {id:"q_goal",text:"いちばん重視したいことは？",type:"single",options:[
      {id:"g_pain",label:"とにかく今の痛みを取りたい",scores:{acute:1}},
      {id:"g_root",label:"根本から良くしたい",scores:{chronic:1,recurrent:1}},
      {id:"g_prevent",label:"もう繰り返したくない",scores:{recurrent:2}},
      {id:"g_move",label:"動けるようにしたい",scores:{rangeOfMotion:2}}
    ]}
  ]
};

/* ============ STATE ============ */
let state={src:"hp",screen:"intro",qIndex:0,answers:{}};

/* ============ LOGIC ============ */
function diagnose(){
  const totals={};
  DATA.questions.forEach(q=>{
    const picked=state.answers[q.id];
    if(!picked) return;
    const ids=Array.isArray(picked)?picked:[picked];
    ids.forEach(oid=>{
      const opt=q.options.find(o=>o.id===oid);
      if(!opt) return;
      Object.entries(opt.scores||{}).forEach(([t,p])=>{totals[t]=(totals[t]||0)+p;});
    });
  });
  let best=DATA.tieBreak[0],bestScore=-1;
  DATA.tieBreak.forEach(t=>{const s=totals[t]||0;if(s>bestScore){best=t;bestScore=s;}});
  return best;
}
const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
function ticketPrice(unit,pct){return unit*(1-pct/100);}

/* ============ RENDER ============ */
const app=document.getElementById("app");
function render(){
  if(state.screen==="intro")return renderIntro();
  if(state.screen==="quiz")return renderQuiz();
  if(state.screen==="result")return renderResult();
}

function renderIntro(){
  const v=DATA.sourceVariants[state.src];
  app.innerHTML=`
    <div class="hero">
      <div class="kicker">SELF CHECK · 来院前セルフチェック</div>
      <h1 class="head">${v.headline}</h1>
      <p class="sub">${v.sub}</p>
      <div class="ornament"></div>
      <button class="start" id="startBtn">チェックを始める</button>
      <p class="sub" style="margin-top:14px;font-size:12px">全${DATA.questions.length}問・約30秒</p>
    </div>`;
  document.getElementById("startBtn").onclick=()=>{state.screen="quiz";state.qIndex=0;render();};
}

function renderQuiz(){
  const q=DATA.questions[state.qIndex];
  const total=DATA.questions.length;
  const picked=state.answers[q.id];
  const isSel=id=>q.type==="multi"?(picked||[]).includes(id):picked===id;
  const pct=Math.round((state.qIndex)/total*100);
  app.innerHTML=`
    <div style="padding-top:22px"></div>
    <div class="prog"><span style="width:${pct}%"></span></div>
    <div class="qcard">
      <div class="qnum">QUESTION ${state.qIndex+1} / ${total}</div>
      <div class="qtext">${q.text}</div>
      <div class="opts">
        ${q.options.map(o=>`
          <button class="opt ${isSel(o.id)?'sel':''}" data-id="${o.id}">
            <span class="tick">${isSel(o.id)?'✓':''}</span>${o.label}
          </button>`).join("")}
      </div>
      ${q.type==="multi"?'<div class="multi-note">あてはまるものをすべて選んでください</div>':''}
      <div class="navrow">
        <button class="nav" id="backBtn" ${state.qIndex===0?'disabled':''}>戻る</button>
        <button class="nav primary" id="nextBtn">${state.qIndex===total-1?'結果を見る':'次へ'}</button>
      </div>
    </div>`;
  app.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.id;
      if(q.type==="multi"){
        const cur=new Set(state.answers[q.id]||[]);
        cur.has(id)?cur.delete(id):cur.add(id);
        state.answers[q.id]=[...cur];
        renderQuiz();
      }else{
        state.answers[q.id]=id;
        if(state.qIndex<total-1){state.qIndex++;render();}
        else renderQuiz();
      }
    };
  });
  document.getElementById("backBtn").onclick=()=>{if(state.qIndex>0){state.qIndex--;render();}};
  document.getElementById("nextBtn").onclick=()=>{
    if(!state.answers[q.id]||(q.type==="multi"&&state.answers[q.id].length===0)){
      document.getElementById("nextBtn").textContent="選択してください";
      setTimeout(()=>renderQuiz(),900);return;
    }
    if(state.qIndex<total-1){state.qIndex++;render();}
    else{state.screen="result";render();}
  };
}

function renderResult(){
  const tid=diagnose();
  const t=DATA.types[tid];
  const hints=DATA.menu.typeMenuHint[tid]||[];
  const menuRows=hints.map(id=>{
    const m=DATA.menu.items.find(x=>x.id===id);
    return `<div class="menucard">
        <div class="mtop">
          <span class="mname">${m.name}</span><span class="pr">${yen(m.price)}</span>
        </div>
        <p class="mdesc">${m.desc}</p>
      </div>`;
  }).join("");

  // 代表単価（このタイプの推奨メニュー1つめ）で回数券価格を出す
  const baseUnit=DATA.menu.items.find(x=>x.id===hints[0]).price;
  const inRange=s=>s>=t.range.min&&s<=t.range.max;
  const ticketRows=DATA.menu.tickets.map(tk=>{
    const total=ticketPrice(baseUnit,tk.discountPct)*tk.sessions;
    const wasTotal=baseUnit*tk.sessions;
    const hot=inRange(tk.sessions);
    return `<div class="tk ${hot?'hot':''}">
      <div class="left">${tk.sessions}回券${hot?'<span class="badge">目安に合致</span>':''}
        ${tk.discountPct>0?`<div class="save">${tk.discountPct}%OFF</div>`:''}
      </div>
      <div class="price">
        ${tk.discountPct>0?`<div class="was">${yen(wasTotal)}</div>`:''}
        <div class="now">${yen(total)}</div>
      </div>
    </div>`;
  }).join("");

  app.innerHTML=`
    <div class="res" style="padding-top:28px">
      <div class="reslabel">YOUR TYPE</div>
      <div style="text-align:center">
        <div class="tname">${t.name}</div>
        <div class="ttag">${t.tag}</div>
      </div>

      <div class="block">
        <h3>なぜこの状態なのか</h3>
        <p>${t.why}</p>
      </div>

      <div class="block">
        <h3>なぜ段階的なケアが有効か</h3>
        <p>${t.whyTime}</p>
        <p>${t.whySteps}</p>
      </div>

      <div class="block">
        <h3>改善ロードマップ</h3>
        <div class="steps">
          ${t.roadmap.map((s,i)=>`<div class="step"><div class="stepnum">STEP${i+1}</div><div class="steptxt">${s}</div></div>`).join("")}
        </div>
      </div>

      <div class="block">
        <h3>通院回数の目安</h3>
        <div class="range">
          <div class="rangebig">${t.range.min}〜${t.range.max}回</div>
          <div class="rangecopy">${t.rangeCopy}</div>
        </div>
        <div class="disc">${DATA.disclaimer}</div>
      </div>

      <div class="block">
        <h3>あなたに向いている施術</h3>
        ${menuRows}
        <p style="font-size:12px;color:var(--ink-soft);margin-top:12px">${DATA.menu.menuCopy}</p>
      </div>

      <div class="block">
        <h3>回数券のご案内（${hints.length?DATA.menu.items.find(x=>x.id===hints[0]).name:''}基準）</h3>
        ${ticketRows}
        <p style="font-size:11px;color:var(--ink-soft);margin-top:12px">※目安に合致する回数券を強調しています。最終的なプランは初回検査でご提案します。</p>
      </div>

      <button class="cta" id="bookBtn">初回予約に進む</button>
      <button class="restart" id="restartBtn">もう一度チェックする</button>
    </div>`;
  document.getElementById("bookBtn").onclick=()=>alert("【プレビュー】ここに予約システム/LINEのURLが入ります。\n流入元: "+state.src);
  document.getElementById("restartBtn").onclick=()=>{state.screen="intro";state.answers={};state.qIndex=0;render();};
}

/* ============ SOURCE SWITCH ============ */
document.getElementById("srcSwitch").querySelectorAll("button").forEach(b=>{
  b.onclick=()=>{
    state.src=b.dataset.src;state.screen="intro";state.answers={};state.qIndex=0;
    document.querySelectorAll("#srcSwitch button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    render();
  };
});

/* ============ SETTINGS DRAWER ============ */
const drawer=document.getElementById("drawer"),overlay=document.getElementById("overlay");
function openDrawer(){buildSettings();drawer.classList.add("open");overlay.classList.add("open");}
function closeDrawer(){drawer.classList.remove("open");overlay.classList.remove("open");}
document.getElementById("gear").onclick=openDrawer;
document.getElementById("closeDrawer").onclick=closeDrawer;
overlay.onclick=closeDrawer;

function buildSettings(){
  const mf=document.getElementById("menuFields");
  mf.innerHTML=DATA.menu.items.map((m,i)=>`
    <div class="field">
      <label>${m.name}</label>
      <input type="number" data-menu="${i}" value="${m.price}" step="100">
      <span class="unit">円</span>
    </div>`).join("");
  mf.querySelectorAll("input").forEach(inp=>{
    inp.oninput=()=>{DATA.menu.items[+inp.dataset.menu].price=+inp.value||0;
      if(state.screen==="result")render();};
  });
  const tf=document.getElementById("ticketFields");
  tf.innerHTML=DATA.menu.tickets.map((tk,i)=>`
    <div class="field">
      <label>${tk.sessions}回券</label>
      <input type="number" data-tk="${i}" value="${tk.discountPct}" step="1" min="0" max="80">
      <span class="unit">%</span>
    </div>`).join("");
  tf.querySelectorAll("input").forEach(inp=>{
    inp.oninput=()=>{DATA.menu.tickets[+inp.dataset.tk].discountPct=+inp.value||0;
      if(state.screen==="result")render();};
  });
}

render();
</script>
</body>
</html>
